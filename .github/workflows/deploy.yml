name: Publicar site

on:
  push:
    branches: [main]
  # Nos pull requests roda só a conferência (sem publicar): o erro aparece antes do merge.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reconstrói o site logo depois que a promoção dos guias vence (valido_ate em data/ofertas.json), para o HTML voltar ao preço normal.
  # Os horários são UTC. A promoção vai até 31/10/2026 23h59 (Brasília, UTC-3), ou seja, 02:59 UTC de 01/11/2026.
  # 03:05 UTC = 00:05 em Brasília; os seguintes são reforços.
  # As páginas dos guias também trocam o preço sozinhas no navegador, sem depender desta publicação.
  schedule:
    - cron: '5 3 1 11 *'
    - cron: '5 4 1 11 *'
    - cron: '5 9 1 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar as páginas dos guias
        run: npm ci --prefix lps
      # Modo de teste (padrão): endereço github.io/webpage, fora do Google.
      # Modo de produção: criar a variável de repositório SITE_PROD com o valor true
      # (Settings > Secrets and variables > Actions > Variables) e rodar o fluxo de novo.
      - name: Gerar site (teste)
        if: ${{ vars.SITE_PROD != 'true' }}
        run: node build.mjs
        env:
          SITE_BASE: /webpage
          SITE_STAGING: '1'
      - name: Gerar site (produção)
        if: ${{ vars.SITE_PROD == 'true' }}
        run: node build.mjs
        env:
          SITE_STAGING: '0'
      - name: Conferir o site gerado
        run: node tests/check.mjs
        env:
          SITE_BASE: ${{ vars.SITE_PROD == 'true' && '' || '/webpage' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Abre o site num navegador de teste e confere cookies, medição, funis e checkout (tests/comportamento.mjs).
  # Usa uma geração à parte, no modo de produção (domínio oficial), sem alterar o que vai para publicação.
  # Se falhar, o deploy não acontece.
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix lps
          npx playwright-core install --with-deps chromium
      - name: Gerar site (modo produção)
        run: node build.mjs
        env:
          SITE_STAGING: '0'
      - name: Testar no navegador
        run: node tests/comportamento.mjs

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [build, navegador]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
