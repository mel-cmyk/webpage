name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Modo de teste (padrão): endereço github.io/webpage, fora do Google.
      # Modo de produção: criar a variável de repositório SITE_PROD com o valor true
      # (Settings > Secrets and variables > Actions > Variables) e rodar o fluxo de novo.
      - name: Gerar site (teste)
        if: ${{ vars.SITE_PROD != 'true' }}
        run: node build.mjs
        env:
          SITE_BASE: /webpage
          SITE_STAGING: '1'
      - name: Gerar site (produção)
        if: ${{ vars.SITE_PROD == 'true' }}
        run: node build.mjs
        env:
          SITE_STAGING: '0'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
