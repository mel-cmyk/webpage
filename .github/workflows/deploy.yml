name: Publicar site

on:
  push:
    branches: [main]
  # Nos pull requests roda só a conferência (sem publicar): o erro aparece antes do merge.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reconstrói o site logo depois que a promoção dos guias vence (valido_ate em data/ofertas.json), para o HTML voltar ao preço normal.
  # Os horários são UTC. A promoção vai até 31/10/2026 23h59 (Brasília, UTC-3), ou seja, 02:59 UTC de 01/11/2026.
  # 03:05 UTC = 00:05 em Brasília; os seguintes são reforços.
  # As páginas dos guias também trocam o preço sozinhas no navegador, sem depender desta publicação.
  schedule:
    - cron: '5 3 1 11 *'
    - cron: '5 4 1 11 *'
    - cron: '5 9 1 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests ficam num grupo à parte: uma conferência de PR nunca cancela uma publicação (e vice-versa).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar as páginas dos guias
        run: npm ci --prefix lps
      # Modo de teste (padrão): endereço github.io/webpage, fora do Google.
      # Modo de produção: criar a variável de repositório SITE_PROD com o valor true
      # (Settings > Secrets and variables > Actions > Variables) e rodar o fluxo de novo.
      - name: Gerar site (teste)
        if: ${{ vars.SITE_PROD != 'true' }}
        run: node build.mjs
        env:
          SITE_BASE: /webpage
          SITE_STAGING: '1'
      - name: Gerar site (produção)
        if: ${{ vars.SITE_PROD == 'true' }}
        run: node build.mjs
        env:
          SITE_STAGING: '0'
      - name: Conferir o site gerado
        run: node tests/check.mjs
        env:
          SITE_BASE: ${{ vars.SITE_PROD == 'true' && '' || '/webpage' }}
      - name: Revisar o texto
        run: node tests/texto.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Abre o site num navegador de teste e confere cookies, medição, funis e checkout (tests/comportamento.mjs).
  # Usa uma geração à parte, no modo de produção (domínio oficial), sem alterar o que vai para publicação.
  # Se falhar, o deploy não acontece.
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix lps
          npx playwright-core install --with-deps chromium
      - name: Gerar site (modo produção)
        run: node build.mjs
        env:
          SITE_STAGING: '0'
      - name: Conferir formatação e regras de código
        run: |
          npm run formatar:conferir
          npm run lint
      - name: Testar no navegador
        run: node tests/comportamento.mjs
      - name: Testar acessibilidade (axe)
        run: node tests/acessibilidade.mjs
      - name: Conferir o orçamento de peso
        run: node tests/orcamento.mjs

  # Só em pull request: monta a main e esta branch lado a lado e compara HTML, estilo calculado e capturas de tela.
  # É um aviso, não um bloqueio: numa mudança de conteúdo é normal haver diferença; numa refatoração, o esperado é "idêntico".
  # O resultado aparece no resumo da execução, e as capturas que mudaram ficam num arquivo anexo.
  comparacao:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: novo
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependências
        run: |
          for d in base novo; do
            (cd $d && npm ci && npm ci --prefix lps)
          done
          (cd novo && npx playwright-core install --with-deps chromium)
      - name: Guardar a referência (main)
        working-directory: base
        env:
          SITE_STAGING: '0'
        run: |
          node build.mjs
          npm run referencia
          npm run visual:salvar
      - name: Gerar esta branch e comparar
        working-directory: novo
        env:
          SITE_STAGING: '0'
        run: |
          node build.mjs
          cp -r ../base/.referencia ../base/.visual .
          {
            echo '## Comparação com a main'
            echo
            echo 'Aviso, não bloqueio: diferença é esperada numa mudança de conteúdo e não numa refatoração.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for passo in comparar visual estilos; do
            echo "### $passo" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            npm run "$passo" 2>&1 | tail -n 40 | grep -v '^>' >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Anexar as capturas que mudaram
        uses: actions/upload-artifact@v7
        with:
          name: capturas-que-mudaram
          path: novo/.visual.novo
          if-no-files-found: ignore

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [build, navegador]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
