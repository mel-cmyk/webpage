# Atualização automática de dependências: abre um pull request por semana, e o CI confere antes de qualquer merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /lps
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
