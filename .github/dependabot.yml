# Atualização automática de dependências: abre um pull request por semana, e o CI confere antes de qualquer merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /lps
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
    ignore:
      # lucide-react 1.x removeu os ícones de marca (Instagram): migrar só junto com a troca desse ícone.
      - dependency-name: lucide-react
        update-types: ['version-update:semver-major']
      # Os tipos acompanham o Node do CI (22): sem salto de versão maior.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
